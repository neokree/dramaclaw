# DramaClaw CE, image mode: both services pull published images (no build). This is the single
# source of the service runtime definition; docker-compose.yml (source build) reuses it via extends.
#   cp .env.example .env && docker compose -f docker-compose.release.yml up -d
# Version: DRAMACLAW_VERSION (api/web) comes from .env; when unset, the default below is used.
# Slow pulls from mainland China: set DRAMACLAW_IMAGE_PREFIX=claymore-registry.cn-chengdu.cr.aliyuncs.com/dramaclaw
# in .env (the ACR mirror carries pinned tags only).
# Two services: api + web (:8080).
# Generation engines: text MTPLX (local) / OpenRouter, image Draw Things (local) / Higgsfield,
# video Higgsfield / h3.c (local), audio Higgsfield.
services:
  api:
    image: ${DRAMACLAW_IMAGE_PREFIX:-claymorelab}/dramaclaw:${DRAMACLAW_VERSION:-2.0.4}
    restart: unless-stopped
    # 运行时从宿主 .env 注入 model/LLM key；镜像版允许没有 .env（首启后再补也行）。
    # environment: 块仍覆盖此处同名变量，保持 CE inline 模式强制不变。
    env_file:
      - path: .env
        required: false
    environment:
      ST_EDITION: ce
      ST_CONTROL_PLANE_DSN: ""
      ST_REDIS_URL: ""
      ST_CELERY_BROKER_URL: ""
      ST_CELERY_RESULT_BACKEND: ""
      NOVELVIDEO_DATA_ROOT: /data
      NOVELVIDEO_OUTPUT_DIR: /data/output
      NOVELVIDEO_STATE_DIR: /data/state
      NOVELVIDEO_RUNTIME_DIR: /data/runtime
      DRAMACLAW_CHAT_BACKEND: hermes
      HERMES_CLI_PATH: /root/.local/bin/hermes
    # 宿主发布端口可配，便于一机多套（每套换 ST_API_PORT + 换 -p 项目名）。
    # 冒号右侧 8780 是容器内端口，固定不变（web 经内部网络访问它）。
    ports:
      - "${ST_API_PORT:-8780}:8780"
    volumes:
      - ce-data:/data

  # SPA served by nginx, reverse-proxying /api + /static to the api service.
  # The image's BACKEND_HOST/PORT defaults target the EE/Helm deploy; here
  # they are overridden to the compose `api` service (internal port 8780). Open
  # the app at http://localhost:8080 — the browser only ever talks to web.
  web:
    image: ${DRAMACLAW_IMAGE_PREFIX:-claymorelab}/dramaclaw-frontend:${DRAMACLAW_VERSION:-2.0.4}
    restart: unless-stopped
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: "8780"
    # 浏览器打开的就是这个端口（默认 8080）。一机多套时换 ST_WEB_PORT。
    ports:
      - "${ST_WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  ce-data:
